<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#302b3d;
  background:
    radial-gradient(circle at top right,#eee7ff 0,#faf7ff 38%,#f7f8fc 100%);
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-2px);
}

input,select{
  width:100%;
  padding:14px 16px;
  border:1px solid #e6dff2;
  border-radius:15px;
  font-size:15px;
  outline:none;
  background:#fff;
  color:#302b3d;
  transition:.2s ease;
}

input:focus,select:focus{
  border-color:#a78bfa;
  box-shadow:0 0 0 4px rgba(167,139,250,.13);
}

::placeholder{
  color:#aaa3b5;
}

/* ================= LOGIN ================= */

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}

.login::before,
.login::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(3px);
  z-index:0;
}

.login::before{
  width:360px;
  height:360px;
  background:#e9ddff;
  top:-140px;
  right:-120px;
  opacity:.8;
}

.login::after{
  width:330px;
  height:330px;
  background:#ffe2ef;
  bottom:-150px;
  left:-120px;
  opacity:.75;
}

.login-box{
  position:relative;
  z-index:1;
  width:100%;
  max-width:410px;
  padding:44px 30px 34px;
  border-radius:30px;
  text-align:center;

  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);

  box-shadow:
    0 25px 70px rgba(83,63,120,.15),
    0 5px 20px rgba(83,63,120,.06);

  border:1px solid rgba(255,255,255,.9);
}

.logo{
  width:78px;
  height:78px;
  margin:0 auto 17px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:24px;

  background:
    linear-gradient(135deg,#8b5cf6,#c084fc);

  color:#fff;
  font-size:27px;
  font-weight:bold;

  box-shadow:
    0 14px 30px rgba(139,92,246,.28);
}

.login-box h1{
  font-size:27px;
  margin-bottom:8px;
  color:#30283e;
}

.login-box p{
  color:#938b9e;
  margin-bottom:27px;
  font-size:14px;
}

.login-box input{
  margin-bottom:12px;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:15px;

  background:
    linear-gradient(135deg,#8b5cf6,#b06cf7);

  color:#fff;
  font-size:16px;
  font-weight:bold;

  box-shadow:
    0 10px 25px rgba(139,92,246,.23);
}

.primary:hover{
  box-shadow:
    0 15px 32px rgba(139,92,246,.30);
}

.secondary{
  background:#f1edf7;
  color:#4e465a;
  padding:10px 14px;
  border-radius:11px;
}

.error{
  color:#d94b70;
  margin-top:13px;
  word-break:break-word;
  font-size:14px;
}

.success{
  color:#15966a;
  margin-top:13px;
  font-size:14px;
}

/* ================= APP ================= */

.app{
  display:none;
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:20;

  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);

  color:#302b3d;
  padding:15px 22px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:1px solid #eee8f5;
}

.header h1{
  font-size:25px;
  font-weight:800;

  background:
    linear-gradient(135deg,#7c3aed,#c084fc);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.logout{
  background:#f2edf7;
  color:#625a6d;
  padding:9px 16px;
  border-radius:12px;
  font-size:13px;
  font-weight:bold;
}

.logout:hover{
  background:#e9e2f1;
}

.container{
  max-width:940px;
  margin:auto;
  padding:30px 20px 50px;
}

/* ================= HOME ================= */

.welcome{
  margin-bottom:28px;
}

.welcome h2{
  font-size:25px;
  margin-bottom:8px;
  color:#342d40;
}

.welcome p{
  color:#938c9e;
  margin-top:8px;
  font-size:14px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card{
  position:relative;
  overflow:hidden;

  background:rgba(255,255,255,.92);

  padding:25px;
  border-radius:23px;

  box-shadow:
    0 8px 30px rgba(75,58,100,.07);

  cursor:pointer;

  border:1px solid #eee8f5;

  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.card::after{
  content:"";
  position:absolute;

  width:105px;
  height:105px;

  border-radius:50%;

  background:#f5efff;

  left:-42px;
  bottom:-52px;
}

.card:hover{
  transform:translateY(-5px);

  box-shadow:
    0 17px 38px rgba(75,58,100,.12);

  border-color:#d9c8f4;
}

.card.admin-card{
  border:1px solid #dfcff7;

  background:
    linear-gradient(145deg,#fff,#faf5ff);
}

.icon{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:
    linear-gradient(135deg,#f0e8ff,#faeafa);

  font-size:27px;

  margin-bottom:16px;

  box-shadow:
    0 7px 17px rgba(139,92,246,.08);
}

.card h3{
  margin-bottom:8px;
  font-size:17px;
  color:#393142;
}

.card p{
  color:#938c9e;
  font-size:13px;
  line-height:1.7;
}

/* ================= PAGES ================= */

.page{
  display:none;
}

.back{
  background:#fff;
  color:#655d70;

  padding:10px 16px;
  border-radius:13px;

  margin-bottom:20px;

  border:1px solid #e8e1ef;

  font-size:14px;

  box-shadow:
    0 4px 13px rgba(70,55,90,.05);
}

.back:hover{
  background:#faf7fd;
}

.box{
  background:rgba(255,255,255,.94);

  padding:24px;
  border-radius:23px;

  margin-bottom:20px;

  box-shadow:
    0 9px 30px rgba(75,58,100,.06);

  border:1px solid #eee8f5;
}

.box h2{
  margin-bottom:20px;
  font-size:19px;
  color:#393142;
}

/* ================= ITEMS ================= */

.item{
  position:relative;

  border:1px solid #ece6f2;

  border-radius:17px;

  padding:17px;

  margin-top:12px;

  background:#fdfcff;

  transition:.2s ease;
}

.item:hover{
  border-color:#ddcff0;

  box-shadow:
    0 8px 22px rgba(75,58,100,.07);

  transform:translateY(-1px);
}

.item-title{
  font-weight:bold;

  margin-bottom:12px;

  color:#403748;

  font-size:15px;
}

.item button{
  background:#f1eaff;

  color:#7647c7;

  padding:9px 13px;

  border-radius:10px;

  font-size:13px;

  font-weight:bold;
}

.item button:hover{
  background:#e9ddff;
}

.item a{
  display:block;

  color:#686071;

  margin-bottom:10px;

  word-break:break-all;

  text-decoration:none;

  line-height:1.7;
}

.item a:hover{
  color:#814dcc;
}

.delete-button{
  background:#fff0f3 !important;
  color:#d04b6a !important;

  margin-top:10px;

  width:100%;

  border:1px solid #ffd9e1;
}

.delete-button:hover{
  background:#ffe5eb !important;
}

.admin-delete{
  background:#fff0f3 !important;
  color:#c43d5c !important;

  border-color:#ffd2dc !important;
}

.empty{
  color:#9b94a3;

  padding:18px 5px;

  text-align:center;

  font-size:14px;
}

.status{
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
}

/* ================= USERS ================= */

.user{
  padding:17px 4px;
  border-bottom:1px solid #eee9f3;
}

.user:last-child{
  border-bottom:0;
}

.small{
  color:#9b94a3;
  font-size:12px;
  margin-top:6px;
}

.admin-label{
  display:inline-block;

  background:#eee4ff;
  color:#7745c8;

  padding:5px 9px;

  border-radius:8px;

  font-size:11px;

  margin-top:8px;

  font-weight:bold;
}

.user-label{
  display:inline-block;

  background:#f2eff5;
  color:#746c7d;

  padding:5px 9px;

  border-radius:8px;

  font-size:11px;

  margin-top:8px;
}

.divider{
  height:1px;
  background:#eee9f3;
  margin:20px 0;
}

.danger{
  background:#fff0f3 !important;
  color:#b72f4f !important;
}

/* ================= FORM ================= */

.box input + br + br{
  display:block;
}

.box select{
  appearance:auto;
}

.box .primary{
  margin-top:2px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .container{
    padding:22px 14px 40px;
  }

  .header{
    padding:13px 15px;
  }

  .header h1{
    font-size:22px;
  }

  .welcome h2{
    font-size:22px;
  }

  .cards{
    grid-template-columns:1fr;
    gap:13px;
  }

  .card{
    padding:21px;
  }

  .box{
    padding:19px 16px;
    border-radius:19px;
  }

  .login-box{
    padding:34px 20px 27px;
    border-radius:25px;
  }
}

@media(max-width:380px){

  .logo{
    width:68px;
    height:68px;
  }

  .box h2{
    font-size:17px;
  }

  input,
  select{
    font-size:14px;
  }
}

html{
  scroll-behavior:smooth;
}
</style>
