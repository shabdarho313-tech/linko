<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linko</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .card p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <header>
    <h1>Linko</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>به Linko خوش آمدید 🌱</h2>

      <p>
        اینجا صفحه اصلی اپلیکیشن Linko است.
        به‌زودی امکانات بیشتری به این صفحه اضافه می‌شود.
      </p>

      <button onclick="showMessage()">
        شروع
      </button>
    </div>
  </div>

  <script>
    function showMessage() {
      alert("به Linko خوش آمدید! ❤️");
    }
  </script>

</body>
</html>
