<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linko | ورود</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      text-align: right;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      margin-top: 15px;
      color: #d33;
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Linko</div>

    <div class="subtitle">
      برای ورود اطلاعات خود را وارد کنید
    </div>

    <input
      type="text"
      id="username"
      placeholder="نام کاربری"
    >

    <input
      type="password"
      id="password"
      placeholder="رمز عبور"
    >

    <button onclick="login()">
      ورود
    </button>

    <div id="message">
      نام کاربری یا رمز عبور اشتباه است.
    </div>

  </div>

  <script>
    function login() {

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      // اطلاعات آزمایشی
      const correctUsername = "admin";
      const correctPassword = "1234";

      if (username === correctUsername && password === correctPassword) {

        message.style.display = "none";

        document.body.innerHTML = `
          <div style="
            text-align:center;
            padding:60px 20px;
            font-family:Arial;
          ">
            <h1>خوش آمدید 🌱</h1>
            <p style="margin-top:20px;">
              ورود با موفقیت انجام شد.
            </p>
          </div>
        `;

      } else {

        message.style.display = "block";

      }
    }
  </script>

</body>
</html>
